<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Babaváró Tipszmiksz</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-official: #0a2f23;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-official: #facc15;
      --accent-hover: #0284c7;
      --border: #334155;
      --border-official: #ca8a04;
    }

    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      position: relative;
    }

    .container {
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 20px;
    }

    .sticky-header-area {
      position: sticky;
      top: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      padding: 15px 0 10px 0;
      z-index: 10;
      border-bottom: 1px solid rgba(51, 65, 85, 0.4);
      margin-bottom: 10px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    h1 { margin: 0; font-size: 1.6rem; }

    header button {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.2s;
      display: none;
    }
    header button:hover { background: var(--accent-hover); color: #fff; }
    header button:disabled { opacity: 0.5; cursor: not-allowed; }

    .modal button {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.2s;
      display: inline-block;
    }
    .modal button:hover { background: var(--accent-hover); color: #fff; }
    .modal button:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-secondary {
      background: transparent !important;
      color: var(--muted) !important;
      border: 1px solid var(--border) !important;
      display: inline-block !important;
    }
    .btn-secondary:hover { background: var(--border) !important; color: var(--text) !important; }

    .entries-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 30px;
      padding-top: 5px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .entry-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 20px;
    }

    .official-card {
      background: var(--card-official);
      border: 2px solid var(--border-official);
      box-shadow: 0 4px 20px rgba(202, 138, 4, 0.15);
      margin-top: 5px;
    }
    .official-card .entry-name {
      color: var(--accent-official) !important;
    }

    .entry-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    
    .entry-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .entry-name { font-weight: 700; font-size: 1.1rem; color: var(--accent); }

    .entry-rank {
      font-weight: 800;
      font-size: 0.85rem;
      padding: 3px 0;
      border-radius: 6px;
      width: 32px;
      text-align: center;
      display: inline-block;
      flex-shrink: 0;
    }
    .rank-1 { background: rgba(250, 204, 21, 0.25); color: #facc15; border: 1px solid rgba(250, 204, 21, 0.5); }
    .rank-2 { background: rgba(148, 163, 184, 0.25); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.5); }
    .rank-3 { background: rgba(180, 83, 9, 0.25); color: #fb923c; border: 1px solid rgba(180, 83, 9, 0.5); }
    .rank-other { background: rgba(100, 116, 139, 0.25); color: #94a3b8; border: 1px solid rgba(100, 116, 139, 0.5); }

    .entry-total-score {
      font-weight: 800;
      font-size: 0.85rem;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .entry-header-right {
      display: flex;
      align-items: center;
    }

    .entry-date { font-size: 0.8rem; color: var(--muted); }
    
    .entry-body {
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      gap: 16px;
    }
    .entry-rows {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
    }
    .entry-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3px 0;
      font-size: 0.95rem;
      gap: 12px;
    }
    .entry-q { color: var(--muted); }
    
    .entry-ans-container {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      text-align: right;
    }
    .entry-a { font-weight: 600; }
    
    .score-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      width: 68px;
      text-align: center;
      flex-shrink: 0;
    }

    .entry-char-side {
      width: 68px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding-right: 8px;
      border-right: 1px solid rgba(51, 65, 85, 0.6);
    }
    .entry-char-side svg {
      max-width: 100%;
      max-height: 76px;
      width: auto;
      height: auto;
      display: block;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 100;
    }
    .modal-backdrop.active { display: flex; }

    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      padding: 24px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .step-pane { display: none; }
    .step-pane.active { display: block; }

    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.95rem; }
    
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
    }

    .question-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
      margin-top: 0;
      margin-bottom: 16px;
    }
    .question-title .sub-text {
      font-weight: 400;
      color: var(--muted);
      font-size: 1rem;
    }

    .question-img-box {
      width: 100%;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      overflow: hidden;
      padding: 10px;
    }
    .question-img-box object {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .dual-card-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .choice-card {
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 170px;
      position: relative;
    }
    .choice-card:hover { border-color: rgba(56, 189, 248, 0.5); }
    
    .choice-card-option {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .choice-card-option:checked + .choice-card {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
    }
    .choice-card-option:checked + .choice-card .custom-radio {
      background-color: var(--accent);
      border-color: var(--accent);
      box-shadow: inset 0 0 0 3px var(--bg);
    }

    .img-container {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .choice-card object {
      max-width: 100%;
      max-height: 80px;
      object-fit: contain;
    }

    .choice-card-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin-top: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      pointer-events: none;
    }
    
    .custom-radio {
      width: 16px;
      height: 16px;
      border: 2px solid var(--muted);
      border-radius: 50%;
      background: var(--bg);
      transition: 0.15s;
    }

    .slider-value-display {
      font-size: 1rem;
      font-weight: 400;
      color: var(--muted);
      text-align: center;
      margin-bottom: 8px;
    }
    .slider-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: var(--text);
      margin-bottom: 6px;
      font-weight: 700;
    }
    .slider-wrap { display: flex; align-items: center; gap: 14px; }
    input[type="range"] { flex: 1; accent-color: var(--accent); cursor: pointer; }

    .modal-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; }
    .modal-actions-right { display: flex; gap: 10px; }
    .status-msg { text-align: center; color: var(--muted); padding: 40px 0; }

    .version-tag {
      position: fixed;
      bottom: 10px;
      right: 15px;
      font-size: 0.75rem;
      color: var(--muted);
      opacity: 0.5;
      pointer-events: none;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="sticky-header-area">
    <header>
      <div>
        <h1 id="pageTitle">Babaváró Tipszmiksz</h1>
      </div>
      <button id="openModalBtn" onclick="openModal()">Válasz beküldése</button>
    </header>
    <div id="officialCardContainer"></div>
  </div>

  <div id="entriesList" class="entries-scroll-area">
    <div class="status-msg">Válaszok betöltése...</div>
  </div>
</div>

<!-- Modal űrlap -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <form id="pollForm" onsubmit="return false;">
      <div class="step-pane active" id="step1">
        <h2 style="margin-top:0; margin-bottom: 16px;">Add meg a neved!</h2>
        <div class="form-group">
          <label for="userName" style="display: none;"></label>
          <input type="text" id="userName" maxlength="10" onkeydown="handleNameKeydown(event)">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" tabindex="-1" onclick="closeModal()">Mégse</button>
          <button type="button" tabindex="-1" onclick="nextStep(1)">Tovább</button>
        </div>
      </div>

      <div class="step-pane" id="step2">
        <div class="question-title" id="q1HeaderTitle">1. Kérdés: <span class="sub-text">Milyen színű lesz Berci?</span></div>
        <div class="question-img-box">
          <object id="charSvg" type="image/svg+xml" data="char.svg"></object>
        </div>
        <div class="form-group">
          <div class="slider-value-display" id="sliderDisplayVal">50% barna bőrű magyar állampolgár</div>
          <div class="slider-labels">
            <span>Tekla</span>
            <span>Zsolt</span>
          </div>
          <div class="slider-wrap">
            <input type="range" id="q1Slider" min="0" max="100" value="50" oninput="updateSliderColor(this.value)">
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" tabindex="-1" onclick="prevStep(2)">Vissza</button>
          <div class="modal-actions-right">
            <button type="button" tabindex="-1" onclick="nextStep(2)">Tovább</button>
          </div>
        </div>
      </div>

      <div class="step-pane" id="step3">
        <div class="question-title" id="q2HeaderTitle">2. Kérdés: <span class="sub-text">Melyik jön ki előbb?</span></div>
        <div class="dual-card-grid">
          <div style="position: relative;">
            <input type="radio" name="q2" value="1" id="q2_opt1" class="choice-card-option" checked>
            <label for="q2_opt1" class="choice-card" id="q2_label1" tabindex="0">
              <div class="img-container">
                <object id="charSvgStep3" type="image/svg+xml" data="char.svg"></object>
              </div>
              <div class="choice-card-footer">
                <div class="custom-radio"></div>
                <span>Berci</span>
              </div>
            </label>
          </div>
          <div style="position: relative;">
            <input type="radio" name="q2" value="2" id="q2_opt2" class="choice-card-option">
            <label for="q2_opt2" class="choice-card" id="q2_label2" tabindex="0">
              <div class="img-container">
                <object type="image/svg+xml" data="logo.svg"></object>
              </div>
              <div class="choice-card-footer">
                <div class="custom-radio"></div>
                <span>GTA VI</span>
              </div>
            </label>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" tabindex="-1" onclick="prevStep(3)">Vissza</button>
          <div class="modal-actions-right">
            <button type="button" tabindex="-1" onclick="nextStep(3)">Tovább</button>
          </div>
        </div>
      </div>

      <div class="step-pane" id="step4">
        <div class="question-title" id="q3HeaderTitle">3. Kérdés: <span class="sub-text">Kinek van nagyobb pénisze?</span></div>
        <div class="dual-card-grid">
          <div style="position: relative;">
            <input type="radio" name="q3" value="1" id="q3_opt1" class="choice-card-option" checked>
            <label for="q3_opt1" class="choice-card" id="q3_label1" tabindex="0">
              <div class="img-container">
                <object id="charSvgStep4" type="image/svg+xml" data="char.svg"></object>
              </div>
              <div class="choice-card-footer">
                <div class="custom-radio"></div>
                <span>Berci</span>
              </div>
            </label>
          </div>
          <div style="position: relative;">
            <input type="radio" name="q3" value="2" id="q3_opt2" class="choice-card-option">
            <label for="q3_opt2" class="choice-card" id="q3_label2" tabindex="0">
              <div class="img-container">
                <object type="image/svg+xml" data="zso.svg"></object>
              </div>
              <div class="choice-card-footer">
                <div class="custom-radio"></div>
                <span>Zsolt</span>
              </div>
            </label>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" tabindex="-1" onclick="prevStep(4)">Vissza</button>
          <div class="modal-actions-right">
            <button type="button" tabindex="-1" id="submitBtn" onclick="submitPoll()">Beküldés</button>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>

<div class="version-tag">v1054</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzEh6WAAWcRXJcsDmRY2VnqzMvvfKRvFOgOLZVNvVPLPD1CszD-oO-kGo9Q5YBPbM_K/exec";

  const CONFIG = {
    title: "Babaváró Tipszmiksz",
    subtitle: "",
    q1Prefix: "1. Kérdés:",
    q1Text: "Milyen színű lesz Berci?",
    q2Prefix: "2. Kérdés:",
    q2Text: "Melyik jön ki előbb?",
    q2Options: { 1: "Berci", 2: "GTA VI" },
    q3Prefix: "3. Kérdés:",
    q3Text: "Kinek van nagyobb pénisze?",
    q3Options: { 1: "Berci", 2: "Zsolt" }
  };

  document.getElementById("pageTitle").textContent = CONFIG.title;
  
  document.getElementById("q1HeaderTitle").innerHTML = `${CONFIG.q1Prefix} <span class="sub-text">${CONFIG.q1Text}</span>`;
  document.getElementById("q2HeaderTitle").innerHTML = `${CONFIG.q2Prefix} <span class="sub-text">${CONFIG.q2Text}</span>`;
  document.getElementById("q3HeaderTitle").innerHTML = `${CONFIG.q3Prefix} <span class="sub-text">${CONFIG.q3Text}</span>`;

  const modal = document.getElementById("modalBackdrop");
  let charSvgRaw = null;
  
  function openModal() {
    showStep(1);
    document.getElementById("pollForm").reset();
    document.getElementById("q2_opt1").checked = true;
    document.getElementById("q3_opt1").checked = true;
    updateSliderColor(50);
    modal.classList.add("active");
  }

  function closeModal() {
    modal.classList.remove("active");
  }

  function getCurrentStep() {
    const panes = document.querySelectorAll('.step-pane');
    for (let i = 0; i < panes.length; i++) {
      if (panes[i].classList.contains('active')) return i + 1;
    }
    return 1;
  }

  function showStep(step) {
    document.querySelectorAll('.step-pane').forEach(el => el.classList.remove('active'));
    document.getElementById('step' + step).classList.add('active');
    
    setTimeout(() => {
      if (step === 1) document.getElementById("userName").focus();
      else if (step === 2) document.getElementById("q1Slider").focus();
      else if (step === 3) document.getElementById("q2_label1").focus();
      else if (step === 4) document.getElementById("q3_label1").focus();
    }, 50);

    const currentSliderVal = document.getElementById('q1Slider').value;
    updateSliderColor(currentSliderVal);
  }

  function nextStep(current) {
    if (current === 1) {
      const nameInput = document.getElementById("userName");
      nameInput.value = nameInput.value.trim();
      if (!nameInput.value) {
        alert("Kérlek add meg a neved!");
        nameInput.focus();
        return;
      }
    } else if (current === 3) {
      const q2Checked = document.querySelector('input[name="q2"]:checked');
      if (!q2Checked) {
        alert("Kérlek válassz egy opciót!");
        return;
      }
    }
    
    if (current < 4) showStep(current + 1);
    else submitPoll();
  }

  function prevStep(current) {
    if (current <= 1) closeModal();
    else showStep(current - 1);
  }

  function handleNameKeydown(e) {
    if (e.key === "Enter") {
      e.preventDefault();
      nextStep(1);
    }
  }

  document.addEventListener("keydown", (e) => {
    if (!modal.classList.contains("active")) return;
    const current = getCurrentStep();
    const activeEl = document.activeElement;
    const isNameInputActive = activeEl && activeEl.id === "userName";

    if (e.key === "Escape") {
      e.preventDefault();
      closeModal();
    } else if (e.key === "Backspace") {
      if (isNameInputActive) return;
      e.preventDefault();
      prevStep(current);
    } else if (e.key === "Enter") {
      if (!isNameInputActive) {
        e.preventDefault();
        if (current < 4) nextStep(current);
        else submitPoll();
      }
    } else if ((current === 3 || current === 4) && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
      e.preventDefault();
      const groupName = current === 3 ? "q2" : "q3";
      const opt1 = document.getElementById(`${groupName}_opt1`);
      const opt2 = document.getElementById(`${groupName}_opt2`);
      const label1 = document.getElementById(`${groupName}_label1`);
      const label2 = document.getElementById(`${groupName}_label2`);

      if (opt1.checked) {
        opt2.checked = true;
        label2.focus();
      } else {
        opt1.checked = true;
        label1.focus();
      }
    }
  });

  function hexToRgb(hex) {
    let bigint = parseInt(hex.replace("#", ""), 16);
    return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255];
  }

  function rgbToHex(r, g, b) {
    return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }

  function getInterpolatedColor(val) {
    let t = Math.max(0, Math.min(100, Number(val) || 0)) / 100;
    let c1 = hexToRgb("#BF998F");
    let c2 = hexToRgb("#A26346");
    let r = Math.round(c1[0] + (c2[0] - c1[0]) * t);
    let g = Math.round(c1[1] + (c2[1] - c1[1]) * t);
    let b = Math.round(c1[2] + (c2[2] - c1[2]) * t);
    return rgbToHex(r, g, b);
  }

  function buildColoredCardChar(val, customId = "") {
    if (!charSvgRaw) return "";
    const color = getInterpolatedColor(val);
    const parser = new DOMParser();
    const doc = parser.parseFromString(charSvgRaw, "image/svg+xml");
    const svgEl = doc.querySelector("svg");
    if (!svgEl) return "";

    svgEl.querySelectorAll('[fill], .fill, #fill').forEach(el => {
      el.style.fill = color;
    });
    const idAttr = customId ? ` id="${customId}"` : "";
    return `<div class="entry-char-side"${idAttr}>${svgEl.outerHTML}</div>`;
  }

  function updateSliderColor(val) {
    document.getElementById('sliderDisplayVal').textContent = val + '% barna bőrű magyar állampolgár';
    const currentColor = getInterpolatedColor(val);

    ['charSvg', 'charSvgStep3', 'charSvgStep4'].forEach(id => {
      try {
        let svgObj = document.getElementById(id);
        if (svgObj) {
          if (svgObj.contentDocument) {
            let svgDoc = svgObj.contentDocument;
            let fillElements = svgDoc.querySelectorAll('[fill], .fill, #fill');
            fillElements.forEach(el => {
              el.style.fill = currentColor;
            });
          }
          svgObj.onload = function() {
            try {
              let svgDoc = svgObj.contentDocument;
              if (svgDoc) {
                svgDoc.querySelectorAll('[fill], .fill, #fill').forEach(el => {
                  el.style.fill = currentColor;
                });
              }
            } catch(ex) {}
          };
        }
      } catch (e) {}
    });
  }

  async function loadCharSvgTemplate() {
    if (charSvgRaw) return;
    try {
      const res = await fetch("char.svg");
      if (res.ok) {
        charSvgRaw = await res.text();
      }
    } catch (e) {}
  }

  function formatDateString(rawDate) {
    if (!rawDate) return "";
    try {
      let d = new Date(rawDate);
      if (!isNaN(d.getTime())) {
        let yyyy = d.getFullYear();
        let mm = String(d.getMonth() + 1).padStart(2, '0');
        let dd = String(d.getDate()).padStart(2, '0');
        let hh = String(d.getHours()).padStart(2, '0');
        let min = String(d.getMinutes()).padStart(2, '0');
        return `${yyyy}.${mm}.${dd} ${hh}:${min}`;
      }
    } catch (e) {}
    
    let clean = String(rawDate).replace('T', ' ').split('.')[0];
    let parts = clean.split(':');
    if (parts.length >= 2) {
      return clean.substring(0, 16).replace(/-/g, '.');
    }
    return rawDate;
  }

  function getScoreBadgeStyle(value, max) {
    let ratio = Math.max(0, Math.min(1, value / max));
    let r = Math.round(239 + (34 - 239) * ratio);
    let g = Math.round(68 + (197 - 68) * ratio);
    let b = Math.round(68 + (94 - 68) * ratio);

    let bgColor = `rgba(${r}, ${g}, ${b}, 0.2)`;
    let textColor = `rgb(${r}, ${g}, ${b})`;
    return `background-color: ${bgColor}; color: ${textColor};`;
  }

  function calculateScores(item, official) {
    if (!official) return { total: 0, s1: 0, s2: 0, s3: 0 };

    let diff1 = Math.abs(Number(item.a1) - Number(official.a1));
    let score1 = 100 - diff1;

    let score2 = (Number(item.a2) === Number(official.a2)) ? 5 : 0;
    let score3 = (Number(item.a3) === Number(official.a3)) ? 5 : 0;

    let total = score1 + score2 + score3;

    return { total, score1, score2, score3 };
  }

  async function loadEntries() {
    const listEl = document.getElementById("entriesList");
    const newBtn = document.getElementById("openModalBtn");
    const officialContainer = document.getElementById("officialCardContainer");
    
    try {
      await loadCharSvgTemplate();
      const res = await fetch(SCRIPT_URL);
      const data = await res.json();

      if (data.locked && data.official) {
        newBtn.style.display = "none";
        
        officialContainer.innerHTML = `
          <div class="entry-card official-card">
            <div class="entry-header">
              <div class="entry-header-left">
                <span class="entry-name">Eredmény</span>
              </div>
              <div class="entry-header-right">
                <span class="entry-date">${formatDateString(data.official.date)}</span>
              </div>
            </div>
            <div class="entry-body">
              ${buildColoredCardChar(data.official.a1, "official-char")}
              <div class="entry-rows">
                <div class="entry-row">
                  <span class="entry-q">Milyen színű lett Berci?</span>
                  <span class="entry-a">${data.official.a1}% BBMÁ</span>
                </div>
                <div class="entry-row">
                  <span class="entry-q">Melyik jött ki előbb?</span>
                  <span class="entry-a">${CONFIG.q2Options[data.official.a2] || data.official.a2}</span>
                </div>
                <div class="entry-row">
                  <span class="entry-q">Kinek van nagyobb pénisze?</span>
                  <span class="entry-a">${CONFIG.q3Options[data.official.a3] || data.official.a3}</span>
                </div>
              </div>
            </div>
          </div>
        `;

        data.entries.forEach(item => {
          item.scores = calculateScores(item, data.official);
        });

        data.entries.sort((a, b) => b.scores.total - a.scores.total);

      } else if (data.locked) {
        newBtn.style.display = "none";
        officialContainer.innerHTML = "";
      } else {
        newBtn.style.display = "block";
        officialContainer.innerHTML = "";
      }

      if (!data.entries.length && (!data.locked || !data.official)) {
        listEl.innerHTML = '<div class="status-msg">Még nem érkezett válasz. Legyél te az első!</div>';
        return;
      }

      const entriesHtml = data.entries.map((item, index) => {
        let rankClass = index === 0 ? "rank-1" : index === 1 ? "rank-2" : index === 2 ? "rank-3" : "rank-other";
        let rankBadge = data.locked && data.official ? `<span class="entry-rank ${rankClass}">#${index + 1}</span>` : "";
        
        let totalStyle = data.locked && data.official ? getScoreBadgeStyle(item.scores.total, 110) : "";
        let totalScoreBadge = data.locked && data.official ? `<span class="entry-total-score" style="${totalStyle}">${item.scores.total} pont</span>` : "";

        let s1Style = data.locked && data.official ? getScoreBadgeStyle(item.scores.score1, 100) : "";
        let s1Badge = data.locked && data.official ? `<span class="score-badge" style="${s1Style}">${item.scores.score1} pont</span>` : "";

        let s2Style = data.locked && data.official ? getScoreBadgeStyle(item.scores.score2, 5) : "";
        let s2Badge = data.locked && data.official ? `<span class="score-badge" style="${s2Style}">${item.scores.score2} pont</span>` : "";

        let s3Style = data.locked && data.official ? getScoreBadgeStyle(item.scores.score3, 5) : "";
        let s3Badge = data.locked && data.official ? `<span class="score-badge" style="${s3Style}">${item.scores.score3} pont</span>` : "";

        return `
          <div class="entry-card">
            <div class="entry-header">
              <div class="entry-header-left">
                ${rankBadge}
                <span class="entry-name">${escapeHtml(item.name)}</span>
                ${totalScoreBadge}
              </div>
              <div class="entry-header-right">
                <span class="entry-date">${formatDateString(item.date)}</span>
              </div>
            </div>
            <div class="entry-body">
              ${buildColoredCardChar(item.a1)}
              <div class="entry-rows">
                <div class="entry-row">
                  <span class="entry-q">Milyen színű lesz Berci?</span>
                  <div class="entry-ans-container">
                    <span class="entry-a">${item.a1}% BBMÁ</span>
                    ${s1Badge}
                  </div>
                </div>
                <div class="entry-row">
                  <span class="entry-q">Melyik jön ki előbb?</span>
                  <div class="entry-ans-container">
                    <span class="entry-a">${CONFIG.q2Options[item.a2] || item.a2}</span>
                    ${s2Badge}
                  </div>
                </div>
                <div class="entry-row">
                  <span class="entry-q">Kinek van nagyobb pénisze?</span>
                  <div class="entry-ans-container">
                    <span class="entry-a">${CONFIG.q3Options[item.a3] || item.a3}</span>
                    ${s3Badge}
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join("");

      listEl.innerHTML = entriesHtml;
    } catch (err) {
      listEl.innerHTML = '<div class="status-msg">Hiba a betöltéskor. Ellenőrizd a SCRIPT_URL beállítást!</div>';
    }
  }

  async function submitPoll() {
    const q3Checked = document.querySelector('input[name="q3"]:checked');
    if (!q3Checked) {
      alert("Kérlek válassz egy opciót!");
      return;
    }

    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "Küldés...";

    const payload = {
      name: document.getElementById("userName").value.trim(),
      a1: Number(document.getElementById("q1Slider").value),
      a2: Number(document.querySelector('input[name="q2"]:checked').value),
      a3: Number(q3Checked.value)
    };

    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });

      closeModal();
      await loadEntries();
    } catch (err) {
      alert("Hiba történt a mentés közben, próbáld újra!");
    } finally {
      btn.disabled = false;
      btn.textContent = "Beküldés";
    }
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  loadEntries();
</script>
</body>
</html>
