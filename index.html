<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CHANGE THIS TO CONTROL THE BROWSER TAB TEXT -->
    <title>Color Picker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #121214;
            color: #f4f4f5;
            padding: 1.5rem;
        }

        /* Large page title above the card */
        .page-title {
            font-size: 2.25rem;
            font-weight: 700;
            margin-bottom: 2rem;
            color: #ffffff;
            letter-spacing: -0.5px;
            text-align: center;
        }

        .card {
            background-color: #1c1c21;
            padding: 2.5rem 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            border: 1px solid #2e2e36;
            text-align: center;
            width: 100%;
            max-width: 360px;
        }

        h2 {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 1.25rem;
            color: #a1a1aa;
            letter-spacing: 0.2px;
        }

        input {
            width: 100%;
            padding: 0.85rem 1.25rem;
            font-size: 1rem;
            color: #ffffff;
            background-color: #2a2a32;
            border: 1px solid #3f3f46;
            border-radius: 9999px; /* Capsule shape */
            outline: none;
            transition: all 0.2s ease-in-out;
        }

        input::placeholder {
            color: #81818c;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
            background-color: #32323c;
        }
    </style>
</head>
<body>
    <!-- Big title at the top of the page -->
    <h1 class="page-title">Color Picker</h1>

    <div class="card">
        <h2>Enter Your Name</h2>
        <input type="text" id="nameBox" placeholder="Type your name here..." autocomplete="off">
    </div>
</body>
</html>
