<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Picker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121214;
            color: #f4f4f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .view {
            display: none;
            width: 100%;
            flex-direction: column;
            gap: 1.5rem;
        }

        .view.active {
            display: flex;
        }

        .card {
            background-color: #1c1c21;
            border: 1px solid #2e2e36;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        h1, h2 {
            text-align: center;
            color: #ffffff;
        }

        .btn {
            background-color: #6366f1;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            padding: 0.85rem 1.5rem;
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: #4f46e5;
        }

        .btn:active {
            transform: scale(0.98);
        }

        select {
            width: 100%;
            padding: 0.85rem;
            background-color: #2a2a32;
            color: #ffffff;
            border: 1px solid #3f3f46;
            border-radius: 9999px;
            outline: none;
            font-size: 1rem;
            cursor: pointer;
        }

        /* List Items */
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2a2a32;
            padding: 1rem 1.25rem;
            border-radius: 14px;
            border: 1px solid #3f3f46;
        }

        .color-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        /* Simple Color Square Preview */
        .square-preview {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 2px solid #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            background-color: #6366f1;
        }

        .large-square {
            width: 140px;
            height: 140px;
            border-radius: 16px;
            border: 3px solid #ffffff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            background-color: #6366f1;
        }

        /* Picker Layout */
        .picker-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            width: 100%;
        }

        .picker-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            width: 100%;
            flex-wrap: wrap;
        }

        .canvas-box {
            position: relative;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #ffffff;
            cursor: crosshair;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .handle {
            position: absolute;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            top: 50%;
            left: 50%;
            box-shadow: 0 0 4px rgba(0,0,0,0.8);
        }

        .hex-display {
            font-family: monospace;
            font-size: 1.1rem;
            color: #a1a1aa;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- VIEW 1: Main List View -->
        <div class="view active" id="listView">
            <h1>Color Claims</h1>
            <div class="card">
                <h2>Claimed Colors</h2>
                <div class="list-item">
                    <span id="listName" style="font-weight: 600; font-size: 1.15rem;">Arnold</span>
                    <div class="color-info">
                        <div class="square-preview" id="listSquare"></div>
                        <span id="listHex" class="hex-display">#6366F1</span>
                    </div>
                </div>
                <button class="btn" id="toNameBtn">Claim Color</button>
            </div>
        </div>

        <!-- VIEW 2: Select Name View -->
        <div class="view" id="nameView">
            <div class="card">
                <h2>Select Your Name</h2>
                <select id="nameSelect">
                    <option value="" disabled selected>Choose your name...</option>
                    <option value="Arnold">Arnold</option>
                    <option value="Alex">Alex</option>
                </select>
                <button class="btn" id="toPickerBtn">Continue</button>
            </div>
        </div>

        <!-- VIEW 3: Interactive Color Picker -->
        <div class="view" id="pickerView">
            <div class="card">
                <h2>Pick a Color</h2>
                
                <div class="picker-layout">
                    <div class="picker-controls">
                        <!-- Wheel Container -->
                        <div class="canvas-box" id="canvasBox">
                            <canvas id="wheel" width="180" height="180"></canvas>
                            <div class="handle" id="handle"></div>
                        </div>

                        <!-- Live Color Square -->
                        <div class="large-square" id="pickerSquare"></div>
                    </div>

                    <div class="hex-display" id="pickerHex">#6366F1</div>
                </div>

                <button class="btn" id="submitBtn">Submit Color</button>
            </div>
        </div>

    </div>

    <script>
        // --- Navigation ---
        const listView = document.getElementById('listView');
        const nameView = document.getElementById('nameView');
        const pickerView = document.getElementById('pickerView');

        document.getElementById('toNameBtn').addEventListener('click', () => {
            listView.classList.remove('active');
            nameView.classList.add('active');
        });

        document.getElementById('toPickerBtn').addEventListener('click', () => {
            const name = document.getElementById('nameSelect').value;
            if (!name) {
                alert('Please select your name first.');
                return;
            }
            nameView.classList.remove('active');
            pickerView.classList.add('active');
        });

        // --- Color Picker Canvas & Math ---
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const handle = document.getElementById('handle');
        const pickerSquare = document.getElementById('pickerSquare');
        const pickerHex = document.getElementById('pickerHex');

        const listName = document.getElementById('listName');
        const listSquare = document.getElementById('listSquare');
        const listHex = document.getElementById('listHex');

        let activeColor = "#6366f1";

        function drawColorWheel() {
            const radius = canvas.width / 2;
            for (let angle = 0; angle < 360; angle += 0.5) {
                const rad = (angle * Math.PI) / 180;
                const grad = ctx.createRadialGradient(radius, radius, 0, radius, radius, radius);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(1, `hsl(${angle}, 100%, 50%)`);
                
                ctx.beginPath();
                ctx.moveTo(radius, radius);
                ctx.arc(radius, radius, radius, rad, rad + (0.5 * Math.PI / 180));
                ctx.closePath();
                ctx.fillStyle = grad;
                ctx.fill();
            }
        }
        drawColorWheel();

        function handlePickerInput(clientX, clientY) {
            const box = document.getElementById('canvasBox').getBoundingClientRect();
            const x = clientX - box.left - box.width / 2;
            const y = clientY - box.top - box.height / 2;
            const radius = box.width / 2;
            const dist = Math.sqrt(x * x + y * y);
            
            let angle = Math.atan2(y, x) * (180 / Math.PI);
            if (angle < 0) angle += 360;
            
            const sat = Math.min(dist / radius, 1);
            const light = 1 - sat * 0.5;
            
            activeColor = hslToHex(angle, sat * 100, light * 100);
            
            // Update preview square & label
            pickerSquare.style.backgroundColor = activeColor;
            pickerHex.textContent = activeColor.toUpperCase();

            // Handle position inside wheel boundaries
            const limitedDist = Math.min(dist, radius - 8);
            handle.style.left = `${radius + limitedDist * Math.cos(angle * Math.PI / 180)}px`;
            handle.style.top = `${radius + limitedDist * Math.sin(angle * Math.PI / 180)}px`;
        }

        // Event listeners for Mouse & Touch (Mobile)
        let isDragging = false;
        const box = document.getElementById('canvasBox');

        box.addEventListener('mousedown', (e) => { isDragging = true; handlePickerInput(e.clientX, e.clientY); });
        window.addEventListener('mousemove', (e) => { if (isDragging) handlePickerInput(e.clientX, e.clientY); });
        window.addEventListener('mouseup', () => { isDragging = false; });

        box.addEventListener('touchstart', (e) => { isDragging = true; handlePickerInput(e.touches[0].clientX, e.touches[0].clientY); });
        window.addEventListener('touchmove', (e) => { if (isDragging) handlePickerInput(e.touches[0].clientX, e.touches[0].clientY); });
        window.addEventListener('touchend', () => { isDragging = false; });

        function hslToHex(h, s, l) {
            l /= 100;
            const a = s * Math.min(l, 1 - l) / 100;
            const f = n => {
                const k = (n + h / 30) % 12;
                const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                return Math.round(255 * color).toString(16).padStart(2, '0');
            };
            return `#${f(0)}${f(8)}${f(4)}`;
        }

        // --- Submit Selection ---
        document.getElementById('submitBtn').addEventListener('click', () => {
            const chosenName = document.getElementById('nameSelect').value;
            listName.textContent = chosenName;
            listSquare.style.backgroundColor = activeColor;
            listHex.textContent = activeColor.toUpperCase();

            pickerView.classList.remove('active');
            listView.classList.add('active');
        });
    </script>
</body>
</html>
