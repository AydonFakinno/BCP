<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Babaváró Tippmix</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --border: #334155;
    }

    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      position: relative;
    }

    .container { width: 100%; max-width: 650px; padding-bottom: 30px; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    h1 { margin: 0; font-size: 1.6rem; }
    .subtitle { color: var(--muted); font-size: 0.95rem; margin-top: 4px; }

    button {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover { background: var(--accent-hover); color: #fff; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-secondary {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: var(--border); color: var(--text); }

    /* Lista kártyák */
    .list { display: flex; flex-direction: column; gap: 14px; }
    .entry-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 20px;
    }
    .entry-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    .entry-name { font-weight: 700; font-size: 1.1rem; color: var(--accent); }
    .entry-date { font-size: 0.8rem; color: var(--muted); }
    .entry-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 0.95rem;
      gap: 12px;
    }
    .entry-q { color: var(--muted); }
    .entry-a { font-weight: 600; text-align: right; }

    /* Modal (Lépésenkénti űrlap) */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 100;
    }
    .modal-backdrop.active { display: flex; }

    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      padding: 24px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .step-pane { display: none; }
    .step-pane.active { display: block; }

    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.95rem; }
    
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
    }

    /* SVG Képhely az 1. kérdéshez */
    .question-img-box {
      width: 100%;
      height: 160px;
      background: rgba(56, 189, 248, 0.05);
      border: 2px dashed var(--border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      overflow: hidden;
      padding: 10px;
    }
    .question-img-box object {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* Slider és Értékjelző */
    .slider-value-display {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      text-align: center;
      margin-bottom: 8px;
    }
    .slider-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 4px;
      font-weight: 600;
    }
    .slider-wrap { display: flex; align-items: center; gap: 14px; }
    input[type="range"] { flex: 1; accent-color: var(--accent); cursor: pointer; }

    /* 1/2 Választó gombok */
    .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .choice-option input { display: none; }
    .choice-box {
      display: block;
      text-align: center;
      padding: 12px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.15s;
    }
    .choice-option input:checked + .choice-box {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
    }

    .modal-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; }
    .modal-actions-right { display: flex; gap: 10px; }
    .status-msg { text-align: center; color: var(--muted); padding: 40px 0; }

    /* Verziószám a sarokban */
    .version-tag {
      position: fixed;
      bottom: 10px;
      right: 15px;
      font-size: 0.75rem;
      color: var(--muted);
      opacity: 0.5;
      pointer-events: none;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1 id="pageTitle">Babaváró Tippmix</h1>
      <div class="subtitle" id="pageSubtitle">Ki mit tippel a nagy napra?</div>
    </div>
    <button onclick="openModal()">+ Új válasz beküldése</button>
  </header>

  <div id="entriesList" class="list">
    <div class="status-msg">Válaszok betöltése...</div>
  </div>
</div>

<!-- Többlépcsős Beküldő Modal -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <form id="pollForm">
      
      <!-- 1. LÉPÉS: NÉV -->
      <div class="step-pane active" id="step1">
        <h2 style="margin-top:0; margin-bottom: 16px;">Ki vagy te?</h2>
        <div class="form-group">
          <label for="userName">Neved / Beceneved</label>
          <input type="text" id="userName" placeholder="Pl. Kovács János">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="closeModal()">Mégse</button>
          <button type="button" onclick="nextStep(1)">Tovább &rarr;</button>
        </div>
      </div>

      <!-- 2. LÉPÉS: 1. KÉRDÉS -->
      <div class="step-pane" id="step2">
        <h2 id="q1HeaderTitle" style="margin-top:0; margin-bottom: 16px; font-size: 1.2rem;">1. Kérdés</h2>
        <div class="question-img-box">
          <object id="charSvg" type="image/svg+xml" data="char.svg"></object>
        </div>
        <div class="form-group">
          <div class="slider-value-display" id="sliderDisplayVal">50% barna bőrű magyar állampolgár</div>
          <div class="slider-labels">
            <span>Tekla</span>
            <span>Zsolt</span>
          </div>
          <div class="slider-wrap">
            <input type="range" id="q1Slider" min="0" max="100" value="50" oninput="updateSliderColor(this.value)">
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="prevStep(2)">&larr; Vissza</button>
          <div class="modal-actions-right">
            <button type="button" onclick="nextStep(2)">Tovább &rarr;</button>
          </div>
        </div>
      </div>

      <!-- 3. LÉPÉS: 2. KÉRDÉS -->
      <div class="step-pane" id="step3">
        <h2 id="q2HeaderTitle" style="margin-top:0; margin-bottom: 16px; font-size: 1.2rem;">2. Kérdés</h2>
        <div class="question-img-box">
          <span>Kép helye (2. kérdés)</span>
        </div>
        <div class="form-group">
          <label id="q2Label">2. Kérdés leírása</label>
          <div class="choice-grid">
            <label class="choice-option">
              <input type="radio" name="q2" value="1">
              <span class="choice-box" id="q2Opt1">Opció 1</span>
            </label>
            <label class="choice-option">
              <input type="radio" name="q2" value="2">
              <span class="choice-box" id="q2Opt2">Opció 2</span>
            </label>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="prevStep(3)">&larr; Vissza</button>
          <div class="modal-actions-right">
            <button type="button" onclick="nextStep(3)">Tovább &rarr;</button>
          </div>
        </div>
      </div>

      <!-- 4. LÉPÉS: 3. KÉRDÉS + BEKÜLDÉS -->
      <div class="step-pane" id="step4">
        <h2 id="q3HeaderTitle" style="margin-top:0; margin-bottom: 16px; font-size: 1.2rem;">3. Kérdés</h2>
        <div class="question-img-box">
          <span>Kép helye (3. kérdés)</span>
        </div>
        <div class="form-group">
          <label id="q3Label">3. Kérdés leírása</label>
          <div class="choice-grid">
            <label class="choice-option">
              <input type="radio" name="q3" value="1">
              <span class="choice-box" id="q3Opt1">Opció 1</span>
            </label>
            <label class="choice-option">
              <input type="radio" name="q3" value="2">
              <span class="choice-box" id="q3Opt2">Opció 2</span>
            </label>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="prevStep(4)">&larr; Vissza</button>
          <div class="modal-actions-right">
            <button type="submit" id="submitBtn">Beküldés</button>
          </div>
        </div>
      </div>

    </form>
  </div>
</div>

<!-- Diszkrét verziószám a jobb alsó sarokban -->
<div class="version-tag">v1008</div>

<script>
  // 1. BEÉPÍTETT GOOGLE APPS SCRIPT URL:
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzEh6WAAWcRXJcsDmRY2VnqzMvvfKRvFOgOLZVNvVPLPD1CszD-oO-kGo9Q5YBPbM_K/exec";

  // 2. ITT TUDOD ÁTÍRNI A KÉRDÉSEKET ÉS A CÍMEKET:
  const CONFIG = {
    title: "Babaváró Tippmix",
    subtitle: "Tippelj, és nézd meg mit mondtak a többiek!",
    q1Text: "1. Kérdés: Milyen színű lesz Berci?",
    q2Text: "Ki fog többet aludni az első hónapban?",
    q2Options: { 1: "Anya", 2: "Apa" },
    q3Text: "Mi lesz az első szó?",
    q3Options: { 1: "Anya / Apa", 2: "Valami inside joke" }
  };

  document.getElementById("pageTitle").textContent = CONFIG.title;
  document.getElementById("pageSubtitle").textContent = CONFIG.subtitle;
  document.getElementById("q1HeaderTitle").textContent = CONFIG.q1Text;
  document.getElementById("q2HeaderTitle").textContent = CONFIG.q2Text + " (2. Kérdés)";
  document.getElementById("q3HeaderTitle").textContent = CONFIG.q3Text + " (3. Kérdés)";
  document.getElementById("q2Label").textContent = CONFIG.q2Text;
  document.getElementById("q2Opt1").textContent = CONFIG.q2Options[1];
  document.getElementById("q2Opt2").textContent = CONFIG.q2Options[2];
  document.getElementById("q3Label").textContent = CONFIG.q3Text;
  document.getElementById("q3Opt1").textContent = CONFIG.q3Options[1];
  document.getElementById("q3Opt2").textContent = CONFIG.q3Options[2];

  const modal = document.getElementById("modalBackdrop");
  
  function openModal() {
    showStep(1);
    document.getElementById("pollForm").reset();
    updateSliderColor(50);
    modal.classList.add("active");
  }

  function closeModal() {
    modal.classList.remove("active");
  }

  function showStep(step) {
    document.querySelectorAll('.step-pane').forEach(el => el.classList.remove('active'));
    document.getElementById('step' + step).classList.add('active');
  }

  function nextStep(current) {
    if (current === 1) {
      const nameInput = document.getElementById("userName");
      if (!nameInput.value.trim()) {
        alert("Kérlek add meg a neved!");
        nameInput.focus();
        return;
      }
    }
    showStep(current + 1);
  }

  function prevStep(current) {
    showStep(current - 1);
  }

  // Színkeverő és SVG színező függvény a sliderhez (#BF998F -> #A26346)
  function hexToRgb(hex) {
    let bigint = parseInt(hex.replace("#", ""), 16);
    return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255];
  }

  function rgbToHex(r, g, b) {
    return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }

  function updateSliderColor(val) {
    document.getElementById('sliderDisplayVal').textContent = val + '% barna bőrű magyar állampolgár';
    
    let t = val / 100;
    let c1 = hexToRgb("#BF998F");
    let c2 = hexToRgb("#A26346");
    
    let r = Math.round(c1[0] + (c2[0] - c1[0]) * t);
    let g = Math.round(c1[1] + (c2[1] - c1[1]) * t);
    let b = Math.round(c1[2] + (c2[2] - c1[2]) * t);
    
    let currentColor = rgbToHex(r, g, b);

    try {
      let svgObj = document.getElementById("charSvg");
      if (svgObj && svgObj.contentDocument) {
        let svgDoc = svgObj.contentDocument;
        let fillElements = svgDoc.querySelectorAll('[fill], .fill, #fill');
        fillElements.forEach(el => {
          el.style.fill = currentColor;
        });
      }
    } catch (e) {
      // CORS kezelés lokális teszthez
    }
  }

  async function loadEntries() {
    const listEl = document.getElementById("entriesList");
    try {
      const res = await fetch(SCRIPT_URL);
      const data = await res.json();

      if (!data.length) {
        listEl.innerHTML = '<div class="status-msg">Még nem érkezett válasz. Legyél te az első!</div>';
        return;
      }

      listEl.innerHTML = data.map(item => `
        <div class="entry-card">
          <div class="entry-header">
            <span class="entry-name">${escapeHtml(item.name)}</span>
            <span class="entry-date">${escapeHtml(item.date)}</span>
          </div>
          <div class="entry-row">
            <span class="entry-q">${CONFIG.q1Text}</span>
            <span class="entry-a">${item.a1}% barna bőrű magyar állampolgár</span>
          </div>
          <div class="entry-row">
            <span class="entry-q">${CONFIG.q2Text}</span>
            <span class="entry-a">${CONFIG.q2Options[item.a2] || item.a2}</span>
          </div>
          <div class="entry-row">
            <span class="entry-q">${CONFIG.q3Text}</span>
            <span class="entry-a">${CONFIG.q3Options[item.a3] || item.a3}</span>
          </div>
        </div>
      `).join("");
    } catch (err) {
      listEl.innerHTML = '<div class="status-msg">Hiba a betöltéskor. Ellenőrizd a SCRIPT_URL beállítást!</div>';
    }
  }

  document.getElementById("pollForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    
    const q2Checked = document.querySelector('input[name="q2"]:checked');
    const q3Checked = document.querySelector('input[name="q3"]:checked');

    if (!q2Checked) {
      alert("Kérlek válassz a 2. kérdésnél!");
      return;
    }
    if (!q3Checked) {
      alert("Kérlek válassz a 3. kérdésnél!");
      return;
    }

    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "Küldés...";

    const payload = {
      name: document.getElementById("userName").value.trim(),
      a1: Number(document.getElementById("q1Slider").value),
      a2: Number(q2Checked.value),
      a3: Number(q3Checked.value)
    };

    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });

      closeModal();
      await loadEntries();
    } catch (err) {
      alert("Hiba történt a mentés közben, próbáld újra!");
    } finally {
      btn.disabled = false;
      btn.textContent = "Beküldés";
    }
  });

  // Debug Reset: X billentyű
  document.addEventListener("keydown", async (e) => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;

    if (e.key.toLowerCase() === "x") {
      if (!confirm("DEBUG: Tényleg törlöd az összes eddigi választ a táblázatból?")) return;

      const listEl = document.getElementById("entriesList");
      listEl.innerHTML = '<div class="status-msg">Táblázat ürítése...</div>';

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ action: "reset" })
        });
        await loadEntries();
      } catch (err) {
        alert("Hiba a reset során!");
      }
    }
  });

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  loadEntries();
</script>
</body>
</html>
