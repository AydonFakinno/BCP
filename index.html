<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Picker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            background-color: #121214;
            color: #f4f4f5;
            position: relative;
            overflow: hidden;
        }

        /* Header Section */
        .top-section {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 25vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 1rem;
            text-align: center;
            z-index: 10;
        }

        .page-title {
            font-size: 7.25rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -1px;
            line-height: 1;
        }

        .device-badge {
            margin-top: 0.5rem;
            font-size: 0.85rem;
            color: #71717a;
            background-color: #1c1c21;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            border: 1px solid #2e2e36;
            letter-spacing: 0.2px;
        }

        /* Interactive Main View */
        .interactive-section {
            position: relative;
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            margin-top: 5vh;
        }

        /* View Containers (Fade Transitions) */
        .default-view, .card, .picker-container, .results-view {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            position: absolute;
        }

        .default-view.fade-in, .card.fade-in, .picker-container.fade-in, .results-view.fade-in {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .default-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.25rem;
            width: 100%;
            max-width: 960px;
            z-index: 2;
            position: relative;
        }

        /* Timed Submission Feedback Banner */
        .success-banner {
            background-color: rgba(34, 197, 94, 0.15);
            border: 1px solid #22c55e;
            color: #4ade80;
            padding: 0.6rem 1.25rem;
            border-radius: 9999px;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .success-banner.show {
            opacity: 1;
            visibility: visible;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 0.75rem;
            width: 100%;
            justify-content: center;
        }

        .claim-btn, .master-btn, .submit-btn, .reset-btn, .confirm-name-btn {
            font-size: 0.95rem;
            font-weight: 600;
            padding: 0.85rem 1.75rem;
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        .claim-btn, .submit-btn, .confirm-name-btn {
            background-color: #6366f1;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
        }

        .claim-btn:hover, .submit-btn:hover, .confirm-name-btn:hover {
            background-color: #4f46e5;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }

        .master-btn {
            background-color: #a855f7;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(168, 85, 247, 0.4);
        }

        .master-btn:hover {
            background-color: #9333ea;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.6);
        }

        .reset-btn {
            background-color: #27272a;
            color: #a1a1aa;
            border: 1px solid #3f3f46;
        }

        .reset-btn:hover {
            background-color: #3f3f46;
            color: #ffffff;
        }

        /* Scrollable Picked Colors List */
        .list-container {
            width: 100%;
            background-color: #1c1c21;
            border-radius: 20px;
            border: 1px solid #2e2e36;
            padding: 1.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .list-title {
            font-size: 0.95rem;
            color: #a1a1aa;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .color-list {
            list-style: none;
            max-height: 320px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding-right: 0.25rem;
        }

        .color-list::-webkit-scrollbar {
            width: 6px;
        }

        .color-list::-webkit-scrollbar-thumb {
            background-color: #3f3f46;
            border-radius: 4px;
        }

        .color-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #2a2a32;
            padding: 1.25rem 1.5rem;
            border-radius: 16px;
            border: 1px solid #3f3f46;
            width: 100%;
        }

        /* Placement Numbers Styling */
        .rank-num {
            font-weight: 700;
            color: #71717a;
            font-family: monospace;
            font-size: 1.35rem;
            margin-right: 0.75rem;
        }

        .rank-num.first-place { color: #eab308; }
        .rank-num.second-place { color: #c0c0c0; }
        .rank-num.third-place { color: #cd7f32; }

        .user-name {
            font-weight: 600;
            color: #f4f4f5;
            font-size: 1.35rem;
        }

        .color-info {
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }

        /* Swatches containing layered SVG */
        .swatch {
            width: 35px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.4));
            position: relative;
        }

        .swatch svg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .hex-code {
            font-family: monospace;
            font-size: 1.25rem;
            color: #a1a1aa;
        }

        .score-match {
            font-weight: 700;
            color: #4ade80;
            font-family: monospace;
            font-size: 1.35rem;
        }

        /* Predefined Name Selection Card */
        .card {
            background-color: #1c1c21;
            padding: 2.5rem 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            border: 1px solid #2e2e36;
            text-align: center;
            width: 100%;
            max-width: 360px;
            z-index: 3;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        h2 {
            font-size: 1.1rem;
            font-weight: 500;
            color: #a1a1aa;
        }

        select.name-select {
            width: 100%;
            padding: 0.85rem 1.25rem;
            font-size: 1rem;
            color: #ffffff;
            background-color: #2a2a32;
            border: 1px solid #3f3f46;
            border-radius: 9999px;
            outline: none;
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23A1A1AA%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 1.25rem center;
            background-size: 0.65rem auto;
        }

        select.name-select option {
            background-color: #1c1c21;
            color: #ffffff;
        }

        select.name-select option:disabled {
            color: #52525b;
        }

        /* Color Selection Screen Container */
        .picker-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            width: 100%;
            max-width: 800px;
        }

        .mode-indicator {
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0.4rem 1rem;
            border-radius: 9999px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .mode-indicator.player {
            background-color: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            border: 1px solid #6366f1;
        }

        .mode-indicator.master {
            background-color: rgba(168, 85, 247, 0.15);
            color: #c084fc;
            border: 1px solid #a855f7;
        }

        .picker-elements {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4rem;
            width: 100%;
        }

        .wheel-wrapper, .square-wrapper, .submit-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            position: relative;
        }

        /* Circular Color Wheel Container */
        .canvas-container {
            position: relative;
            width: 206px;
            height: 206px;
            cursor: crosshair;
            border-radius: 50%;
            border: 3px solid #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            border-radius: 50%;
            width: 200px;
            height: 200px;
        }

        .color-handle {
            position: absolute;
            width: 18px;
            height: 18px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.6);
            pointer-events: none;
            transform: translate(-50%, -50%);
            top: 50%;
            left: 50%;
            z-index: 5;
        }

        /* Main Preview shape container with updated layered SVGs */
        .color-preview {
            width: 139px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.4));
            position: relative;
        }

        .color-preview svg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .label {
            font-size: 0.95rem;
            color: #a1a1aa;
            font-weight: 500;
        }

        /* Results Leaderboard View */
        .results-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.25rem;
            width: 100%;
            max-width: 960px;
            z-index: 5;
        }

        .master-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            background-color: #1c1c21;
            padding: 1.25rem 1.5rem;
            border-radius: 16px;
            border: 1px solid #a855f7;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.2);
        }

        .winner-tag {
            background-color: #eab308;
            color: #000000;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            text-transform: uppercase;
            margin-left: 0.5rem;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header class="top-section">
        <h1 class="page-title">Color Picker</h1>
        <div class="device-badge" id="deviceBadge">Detecting device...</div>
    </header>

    <!-- Interactive Workspace -->
    <main class="interactive-section">

        <!-- Default Main View -->
        <div class="default-view fade-in" id="defaultView">
            <div class="success-banner" id="successBanner">Your color has been submitted!</div>
            
            <div class="list-container">
                <div class="list-title">Claimed Colors</div>
                <ul class="color-list" id="colorList">
                    <!-- Dynamic entries render here -->
                </ul>
            </div>

            <div class="btn-group">
                <button class="claim-btn" id="startClaimBtn">Claim Color</button>
                <button class="master-btn" id="enterMasterBtn">Enter Master Color</button>
            </div>
        </div>

        <!-- Predefined Name Selection Card -->
        <div class="card" id="nameCard">
            <h2>Select Your Name</h2>
            <select class="name-select" id="nameSelect">
                <option value="" disabled selected>Choose your name...</option>
                <option value="Arnold">Arnold</option>
                <option value="Alex">Alex</option>
                <option value="Sarah">Sarah</option>
                <option value="Mark">Mark</option>
                <option value="David">David</option>
                <option value="Emma">Emma</option>
            </select>
            <button class="confirm-name-btn" id="confirmNameBtn">Continue to Pick</button>
        </div>

        <!-- Interactive Color Picker UI -->

            <div class="mode-indicator player" id="modeIndicator">Player Pick</div>
            <div class="picker-elements">
                <div class="wheel-wrapper">
                    <div class="canvas-container" id="canvasContainer">
                        <canvas id="colorWheel" width="200" height="200"></canvas>
                        <div class="color-handle" id="colorHandle"></div>
                    </div>
                    <span class="label">Pick a Color</span>
