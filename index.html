<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Picker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            background-color: #121214;
            color: #f4f4f5;
            position: relative;
            overflow: hidden;
        }

        .top-section {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 25vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 1rem;
            text-align: center;
            z-index: 10;
        }

        .page-title {
            font-size: 7.25rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -1px;
            line-height: 1;
        }

        .device-badge {
            margin-top: 0.5rem;
            font-size: 0.85rem;
            color: #71717a;
            background-color: #1c1c21;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            border: 1px solid #2e2e36;
        }

        .interactive-section {
            position: relative;
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            margin-top: 5vh;
        }

        .default-view, .card, .picker-container, .results-view {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            position: absolute;
        }

        .default-view.fade-in, .card.fade-in, .picker-container.fade-in, .results-view.fade-in {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .default-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.25rem;
            width: 100%;
            max-width: 960px;
            z-index: 2;
        }

        .btn-group {
            display: flex;
            gap: 0.75rem;
            width: 100%;
            justify-content: center;
        }

        .claim-btn, .master-btn, .submit-btn, .reset-btn, .confirm-name-btn {
            font-size: 0.95rem;
            font-weight: 600;
            padding: 0.85rem 1.75rem;
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        .claim-btn, .submit-btn, .confirm-name-btn {
            background-color: #6366f1;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
        }

        .claim-btn:hover, .submit-btn:hover, .confirm-name-btn:hover {
            background-color: #4f46e5;
            transform: translateY(-2px);
        }

        .master-btn {
            background-color: #a855f7;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(168, 85, 247, 0.4);
        }

        .master-btn:hover {
            background-color: #9333ea;
            transform: translateY(-2px);
        }

        .list-container {
            width: 100%;
            background-color: #1c1c21;
            border-radius: 20px;
            border: 1px solid #2e2e36;
            padding: 1.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .list-title {
            font-size: 0.95rem;
            color: #a1a1aa;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .color-list {
            list-style: none;
            max-height: 320px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .color-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #2a2a32;
            padding: 1.25rem 1.5rem;
            border-radius: 16px;
            border: 1px solid #3f3f46;
            width: 100%;
        }

        .user-name {
            font-weight: 600;
            color: #f4f4f5;
            font-size: 1.35rem;
        }

        .color-info {
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }

        /* Unified Swatch Container */
        .swatch {
            width: 35px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.4));
        }

        .swatch svg {
            width: 100%;
            height: 100%;
        }

        .hex-code {
            font-family: monospace;
            font-size: 1.25rem;
            color: #a1a1aa;
        }

        .card {
            background-color: #1c1c21;
            padding: 2.5rem 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            border: 1px solid #2e2e36;
            text-align: center;
            width: 100%;
            max-width: 360px;
            z-index: 3;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        h2 {
            font-size: 1.1rem;
            font-weight: 500;
            color: #a1a1aa;
        }

        select.name-select {
            width: 100%;
            padding: 0.85rem 1.25rem;
            font-size: 1rem;
            color: #ffffff;
            background-color: #2a2a32;
            border: 1px solid #3f3f46;
            border-radius: 9999px;
            outline: none;
            cursor: pointer;
        }

        .picker-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            width: 100%;
            max-width: 800px;
        }

        .mode-indicator {
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0.4rem 1rem;
            border-radius: 9999px;
            text-transform: uppercase;
        }

        .mode-indicator.player {
            background-color: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            border: 1px solid #6366f1;
        }

        .picker-elements {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4rem;
            width: 100%;
        }

        .wheel-wrapper, .square-wrapper, .submit-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            position: relative;
        }

        .canvas-container {
            position: relative;
            width: 206px;
            height: 206px;
            cursor: crosshair;
            border-radius: 50%;
            border: 3px solid #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            border-radius: 50%;
            width: 200px;
            height: 200px;
        }

        .color-handle {
            position: absolute;
            width: 18px;
            height: 18px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.6);
            pointer-events: none;
            transform: translate(-50%, -50%);
            top: 50%;
            left: 50%;
            z-index: 5;
        }

        .color-preview {
            width: 135px;
            height: 196px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.4));
        }

        .color-preview svg {
            width: 100%;
            height: 100%;
        }

        .label {
            font-size: 0.95rem;
            color: #a1a1aa;
            font-weight: 500;
        }
    </style>
</head>

    <script>
        // JS Color Wheel & State Logic
        const canvas = document.getElementById('colorWheel');
        const ctx = canvas.getContext('2d');
        const handle = document.getElementById('colorHandle');
        const hexLabel = document.getElementById('hexLabel');
        const fillPath = document.getElementById('fill');

        let currentColor = "#6366f1";

        function drawWheel() {
            const radius = canvas.width / 2;
            const cx = radius;
            const cy = radius;
            
            for (let angle = 0; angle < 360; angle += 0.5) {
                const rad = (angle * Math.PI) / 180;
                const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
                grad.addColorStop(0, 'white');
                grad.addColorStop(1, `hsl(${angle}, 100%, 50%)`);
                
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, radius, rad, rad + (0.5 * Math.PI / 180));
                ctx.closePath();
                ctx.fillStyle = grad;
                ctx.fill();
            }
        }

        drawWheel();

        // Color update helper
        function updateSelectedColor(hex) {
            currentColor = hex;
            hexLabel.textContent = hex.toUpperCase();
            fillPath.setAttribute('fill', hex);
        }

        // Handle interactions
        let isDragging = false;
        const container = document.getElementById('canvasContainer');

        function handleColorPick(e) {
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            const radius = rect.width / 2;
            const dist = Math.sqrt(x * x + y * y);
            
            let angle = Math.atan2(y, x) * (180 / Math.PI);
            if (angle < 0) angle += 360;
            
            const saturation = Math.min(dist / radius, 1);
            const lightness = 1 - saturation * 0.5;
            
            // Convert HSL to HEX approx
            const hex = hslToHex(angle, saturation * 100, lightness * 100);
            updateSelectedColor(hex);

            const limitedDist = Math.min(dist, radius - 10);
            const handleX = radius + limitedDist * Math.cos(angle * Math.PI / 180);
            const handleY = radius + limitedDist * Math.sin(angle * Math.PI / 180);
            
            handle.style.left = `${handleX}px`;
            handle.style.top = `${handleY}px`;
        }

        container.addEventListener('mousedown', (e) => { isDragging = true; handleColorPick(e); });
        window.addEventListener('mousemove', (e) => { if (isDragging) handleColorPick(e); });
        window.addEventListener('mouseup', () => { isDragging = false; });

        function hslToHex(h, s, l) {
            l /= 100;
            const a = s * Math.min(l, 1 - l) / 100;
            const f = n => {
                const k = (n + h / 30) % 12;
                const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                return Math.round(255 * color).toString(16).padStart(2, '0');
            };
            return `#${f(0)}${f(8)}${f(4)}`;
        }

        // Navigation flows
        document.getElementById('startClaimBtn').addEventListener('click', () => {
            document.getElementById('defaultView').classList.remove('fade-in');
            document.getElementById('nameCard').classList.add('fade-in');
        });

        document.getElementById('confirmNameBtn').addEventListener('click', () => {
            document.getElementById('nameCard').classList.remove('fade-in');
            document.getElementById('pickerContainer').classList.add('fade-in');
        });
    </script>
</body>
</html>
