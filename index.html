<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Picker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            background-color: #121214;
            color: #f4f4f5;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top 1/4th section (25vh) */
        .top-section {
            height: 25vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 1rem;
            text-align: center;
        }

        .page-title {
            font-size: 7.25rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -1px;
            line-height: 1;
        }

        /* Bottom 3/4th interactive section (75vh) */
        .interactive-section {
            height: 75vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .card {
            background-color: #1c1c21;
            padding: 2.5rem 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            border: 1px solid #2e2e36;
            text-align: center;
            width: 100%;
            max-width: 360px;
        }

        h2 {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 1.25rem;
            color: #a1a1aa;
            letter-spacing: 0.2px;
        }

        input {
            width: 100%;
            padding: 0.85rem 1.25rem;
            font-size: 1rem;
            color: #ffffff;
            background-color: #2a2a32;
            border: 1px solid #3f3f46;
            border-radius: 9999px; /* Capsule shape */
            outline: none;
            transition: all 0.2s ease-in-out;
        }

        input::placeholder {
            color: #81818c;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
            background-color: #32323c;
        }
    </style>
</head>
<body>

    <!-- Top 1/4th static header -->
    <header class="top-section">
        <h1 class="page-title">Color Picker</h1>
    </header>

    <!-- Bottom 3/4th interactive workspace -->
    <main class="interactive-section">
        <div class="card">
            <h2>Enter Your Name</h2>
            <input type="text" id="nameBox" placeholder="Type your name here..." autocomplete="off">
        </div>
    </main>

</body>
</html>
