<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Picker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            background-color: #121214;
            color: #f4f4f5;
            position: relative;
            overflow: hidden;
        }

        /* Top 1/4th absolute static header */
        .top-section {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 25vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 1rem;
            text-align: center;
            z-index: 10;
        }

        .page-title {
            font-size: 7.25rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -1px;
            line-height: 1;
        }

        /* Live Device / Orientation Badge */
        .device-badge {
            margin-top: 0.5rem;
            font-size: 0.85rem;
            color: #71717a;
            background-color: #1c1c21;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            border: 1px solid #2e2e36;
            letter-spacing: 0.2px;
        }

        /* Full screen interactive section */
        .interactive-section {
            position: relative;
            height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        /* Name Card Setup & Animation */
        .card {
            background-color: #1c1c21;
            padding: 2.5rem 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            border: 1px solid #2e2e36;
            text-align: center;
            width: 100%;
            max-width: 360px;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
            z-index: 2;
        }

        .card.slide-down {
            transform: translateY(120vh);
            opacity: 0;
            pointer-events: none;
        }
